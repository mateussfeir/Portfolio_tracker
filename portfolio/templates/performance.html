{% extends "base.html" %}
{% block content %}
<h2>Performance</h2>
<div style="margin-bottom: 2em;">
    {{ chart|safe }}
</div>
<table class="table table-dark table-striped">
    <thead>
        <tr>
            <th>Date</th>
            <th>Net Worth ({{ currency_symbol }})</th>
        </tr>
    </thead>
    <tbody>
        {% for snap in snapshots %}
        <tr>
            <td>{{ snap.date }}</td>
            <td>{{ snap.net_worth }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
